name: CI

on:
  push:
    branches: [main]
    paths: ["api/**", "frontend/**", ".github/workflows/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write        # push the image-tag bump commit (GitOps)
  packages: write        # push images to GHCR
  security-events: write # upload Trivy results to the Security tab

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/jobtrack

jobs:
  test:
    name: Lint & test API
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Pytest
        run: pytest -q

  helm-lint:
    name: Lint Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint helm/jobtrack -f helm/jobtrack/values-dev.yaml
      - run: helm template jobtrack helm/jobtrack -f helm/jobtrack/values-dev.yaml > /dev/null

  build-scan-push:
    name: Build, scan & push ${{ matrix.service }}
    needs: [test, helm-lint]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [api, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Set image tag (short commit SHA)
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ env.TAG }}
          build-args: APP_VERSION=${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ env.TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy report (SARIF, HIGH+CRITICAL)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-${{ matrix.service }}.sarif

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          IMAGE=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  update-manifests:
    name: Bump image tags (GitOps)
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Update tags in values.yaml
        run: |
          TAG=${GITHUB_SHA::7}
          # yq edits YAML safely (preinstalled on GitHub runners)
          yq -i ".api.image.tag = \"$TAG\" | .frontend.image.tag = \"$TAG\"" helm/jobtrack/values.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ci: deploy $TAG [skip ci]" || echo "Nothing to commit"
          git push
