# Default values for jobtrack (production-like).
# Environment overrides live in values-dev.yaml / values-prod.yaml.

api:
  image:
    repository: ghcr.io/ahmed-elgamil-devops/jobtrack-api
    # The CI pipeline updates this tag automatically after every successful build (GitOps).
    tag: "7481a38"
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8000
  logLevel: INFO
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
frontend:
  image:
    repository: ghcr.io/ahmed-elgamil-devops/jobtrack-frontend
    tag: "7481a38"
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {cpu: 200m, memory: 64Mi}
postgres:
  image: postgres:16-alpine
  database: jobtrack
  user: jobtrack
  # For a real environment, create the secret yourself (or with Sealed Secrets / External Secrets)
  # and set existingSecret. The generated password is only for local demos.
  existingSecret: ""
  storage: 1Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
ingress:
  enabled: true
  className: nginx
  host: jobtrack.local
# Creates a ServiceMonitor so kube-prometheus-stack scrapes the API /metrics endpoint.
metrics:
  serviceMonitor:
    enabled: true
    interval: 15s
    # Must match the release label your Prometheus selects on
    releaseLabel: monitoring
  # Ships the Grafana dashboard as a ConfigMap picked up by the Grafana sidecar
  grafanaDashboard:
    enabled: true
