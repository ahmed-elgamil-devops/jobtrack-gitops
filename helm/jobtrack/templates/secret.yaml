{{- if not .Values.postgres.existingSecret }}
{{- $name := include "jobtrack.dbSecret" . }}
{{- /* Reuse the existing password on upgrades so the database keeps working */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := randAlphaNum 24 }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "jobtrack.labels" . | nindent 4 }}
  annotations:
    # Argo CD: don't flag the generated password as drift
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  username: {{ .Values.postgres.user | quote }}
  password: {{ $password | quote }}
  database: {{ .Values.postgres.database | quote }}
{{- end }}
