# Local development: docker compose up --build  ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobtrack
      POSTGRES_USER: jobtrack
      POSTGRES_PASSWORD: jobtrack-local-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrack -d jobtrack"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./api
      args:
        APP_VERSION: local
    environment:
      DATABASE_URL: postgresql+psycopg2://jobtrack:jobtrack-local-only@db:5432/jobtrack
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      API_UPSTREAM: api:8000
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  pgdata:
