# One control-plane node with ports 80/443 mapped to localhost for the ingress controller
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: jobtrack
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
      - containerPort: 443
        hostPort: 443
